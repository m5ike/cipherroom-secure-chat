name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: |
          CI=1 LOG_EVENTS=0 PORT=5050 node dist/index.cjs &
          SERVER_PID=$!
          sleep 3
          curl -fsS http://127.0.0.1:5050/api/health > /tmp/health.json
          cat /tmp/health.json
          test "$(jq -r .ok /tmp/health.json)" = "true"
          test "$(jq -r .persistence /tmp/health.json)" = "none"
          test "$(jq -r .role /tmp/health.json)" = "webrtc-signaling-only"
          kill $SERVER_PID
      - name: Publish coverage
        if: matrix.os == 'ubuntu-latest'
        run: |
          npm install -g codecov
          codecov
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm audit --audit-level=high
