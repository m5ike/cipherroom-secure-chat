# =============================================================================
# GitHub Actions CI workflow — runs on every PR and on push to master.
#
# Triggers:
#   - pull_request targeting master or any feature/* / release/* branch
#   - push to master, release/*, feature/*
#
# Jobs (independent, fail-fast disabled for richer failure logs):
#   1. typecheck — `tsc --noEmit`
#   2. lint-custom — `bash scripts/pre-commit-check.sh` (portal-escape
#      invariants from v2.4.1)
#   3. unit-test — `vitest run` with verbose reporter
#   4. build-smoke — `npm run build` (custom tsx/esbuild) and verify
#      dist/ artefact tree
#   5. installer — shellcheck + a real install -> update -> uninstall cycle
#   6. e2e — Playwright: UI smoke, two peers (messages, files P2P and through
#      the relay), an encrypted call, passkey accounts with away relay and
#      recovery, the operator console with roles
#   7. supply-chain — npm audit of the production dependencies, the
#      release manifest round trip (release:manifest → release:verify)
#   8. ci-aggregate — gate, exits 1 if any of the above failed
#
# Cache: GitHub-managed npm cache keyed on package-lock.json.
# Supply chain (6.12, F-29): every third-party action is pinned to a full
# commit SHA (the tag it was resolved from is the trailing comment), the e2e
# container image to a digest; `npm ci` keeps npm's audit report on. CodeQL
# runs in codeql.yml.
# =============================================================================

name: CI

on:
  pull_request:
    branches: [master, 'release/**', 'feature/**', 'clean-installation']
  push:
    branches: [master, 'release/**', 'feature/**', 'clean-installation']

# Cancel an in-flight CI run for the same ref — saves minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only token for every job: nothing here writes to the repository.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Job 1 — TypeScript typecheck
  # ---------------------------------------------------------------------------
  typecheck:
    name: TypeScript
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-fund

      - name: tsc --noEmit
        run: npx tsc --noEmit -p tsconfig.json

  # ---------------------------------------------------------------------------
  # Job 2 — MainMenu portal-escape custom guard
  # ---------------------------------------------------------------------------
  lint-custom:
    name: check:menu
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-fund

      - name: scripts/pre-commit-check.sh
        run: bash scripts/pre-commit-check.sh

  # ---------------------------------------------------------------------------
  # Job 3 — Unit tests (vitest, .ts and .tsx, happy-dom)
  # ---------------------------------------------------------------------------
  unit-test:
    name: vitest
    runs-on: ubuntu-22.04
    # The SQLCipher module compiles from source when no prebuilt binary
    # matches this runner's Node version, which takes several minutes of an
    # otherwise two-minute job.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-fund

      # The cluster bus test (test/cluster-redis.test.ts) runs two instances
      # through a real Redis server it starts on a port of its own; without
      # the binary it is skipped.
      - name: redis-server for the cluster test
        run: |
          sudo apt-get install -y --no-install-recommends redis-server
          sudo systemctl stop redis-server || true

      # One file at a time: the SQLCipher tests open real databases, and a
      # two-core runner running fifty files at once turned that into a
      # wall-clock problem. Serial is a few seconds slower and legible when
      # something stalls.
      - name: vitest run
        run: npx vitest run --reporter=verbose --no-file-parallelism

      - name: Upload test artefacts on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vitest-failures
          path: |
            vitest-results.json
            **/*.log
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Job 4 — Production build smoke
  # ---------------------------------------------------------------------------
  build-smoke:
    name: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-fund

      - name: npm run build
        run: npm run build

      - name: Verify dist artifact
        run: |
          ls -la dist/ | head -20
          test -f dist/index.cjs && echo "OK: dist/index.cjs present"
          test -d dist/public && echo "OK: dist/public/ present"
          npm run release:verify -- --root dist/public --manifest dist/public/release-web.json

  # ---------------------------------------------------------------------------
  # Job 5 — Installer: lint + a real install -> update -> uninstall cycle
  # ---------------------------------------------------------------------------
  installer:
    name: installer
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.x'
          cache: 'npm'

      # The `runner` context is not available in job-level `env`, so the
      # scratch paths are exported from a step instead.
      - name: Scratch paths
        run: |
          echo "XDG_CONFIG_HOME=$RUNNER_TEMP/xdg" >> "$GITHUB_ENV"
          echo "M5_DIR=$RUNNER_TEMP/m5cet" >> "$GITHUB_ENV"

      - name: shellcheck
        run: shellcheck -x -S warning install.sh update.sh uninstall.sh check.sh installer/lib/*.sh scripts/pre-commit-check.sh

      - name: Dry run (docker mode)
        run: ./install.sh --dry-run -n --lang en --user-scope --mode docker --dir "$M5_DIR" --skip-deps

      - name: Install (native, user scope, local sources)
        run: |
          ./install.sh -n --lang en --user-scope --mode native --source-path "$PWD" \
            --dir "$M5_DIR" --port 5190 --enable-admin --set ADMIN_PORT=5191 --enable-push
          curl -fsS http://127.0.0.1:5190/api/health
          test "$(stat -c %a "$M5_DIR/.env")" = "600"
          # Explicit if/exit: `! grep …` is ignored by `bash -e`, so it would
          # pass even with a secret in the file.
          if grep -qE 'TOKEN|PRIVATE|CREDENTIAL' "$M5_DIR/.m5cet/install.conf"; then
            echo "secrets leaked into install.conf"; exit 1
          fi
          grep -q '^ADMIN_API_TOKEN=' "$M5_DIR/.env"

      # 6.12: the installation check against the real install — never a
      # usage error, valid JSON, and the served assets match release-web.json.
      - name: check.sh (package, config, runtime)
        run: |
          set +e
          "$M5_DIR/check.sh" --offline --lang en --only package,config,runtime --json > "$RUNNER_TEMP/check.json"
          rc=$?
          set -e
          "$M5_DIR/check.sh" --offline --lang en --quiet --no-color --only package,config,runtime || true
          test "$rc" -ne 2
          node -e '
            const r = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            const web = r.checks.find((c) => c.id === "package.web");
            if (!web || web.status !== "PASS") { console.error("package.web:", web); process.exit(1); }
            const svc = r.checks.find((c) => c.id === "runtime.health");
            if (!svc || svc.status !== "PASS") { console.error("runtime.health:", svc); process.exit(1); }
          ' "$RUNNER_TEMP/check.json"

      - name: Update (change a parameter, reuse the build)
        run: |
          "$M5_DIR/update.sh" -y --lang en --config-only --set APP_PORT=5192
          curl -fsS http://127.0.0.1:5192/api/health

      - name: Uninstall (purge) leaves nothing behind
        run: |
          "$M5_DIR/uninstall.sh" -y --lang en --purge
          test ! -e "$M5_DIR"
          test ! -e "$XDG_CONFIG_HOME/m5cet/install-dir"

  # ---------------------------------------------------------------------------
  # Job 6 — End to end: UI smoke + two real browsers against the real server
  # The image tag must match the `playwright` version in package-lock.json.
  # ---------------------------------------------------------------------------
  e2e:
    name: e2e
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    container:
      # v1.63.0-noble, pinned by digest (resolved from mcr.microsoft.com 2026-10-05).
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # SQLCipher (better-sqlite3-multiple-ciphers) is a native module. The
      # Playwright image has no compiler, so when no prebuilt binary matches
      # its Node version, npm falls back to node-gyp and needs these. The
      # dependency is optional — without it the server runs without storage —
      # but e2e is where the storage is actually exercised.
      - name: Build tools for the native SQLCipher module
        run: apt-get update && apt-get install -y --no-install-recommends build-essential python3

      - name: Install dependencies
        run: npm ci --no-fund

      - name: Build
        run: npm run build

      - name: vitest (e2e config)
        run: npx vitest run --config vitest.e2e.config.ts --reporter=verbose

  # ---------------------------------------------------------------------------
  # Job 7 — Supply chain: audit of the production dependencies, and the
  # release manifest round trip (docs/install-check.md)
  # ---------------------------------------------------------------------------
  supply-chain:
    name: supply chain
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-fund

      - name: npm audit (production dependencies, high and above)
        run: npm audit --omit=dev --audit-level=high

      - name: Release manifest round trip
        run: |
          npm run release:manifest -- --out "$RUNNER_TEMP/release.json"
          npm run release:verify -- --manifest "$RUNNER_TEMP/release.json"

  # ---------------------------------------------------------------------------
  # Job 8 — Aggregate gate
  # ---------------------------------------------------------------------------
  ci-aggregate:
    name: CI aggregate
    runs-on: ubuntu-22.04
    needs: [typecheck, lint-custom, unit-test, build-smoke, installer, e2e, supply-chain]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [ "${{ needs.typecheck.result }}" != "success" ] || \
             [ "${{ needs.lint-custom.result }}" != "success" ] || \
             [ "${{ needs.unit-test.result }}" != "success" ] || \
             [ "${{ needs.build-smoke.result }}" != "success" ] || \
             [ "${{ needs.installer.result }}" != "success" ] || \
             [ "${{ needs.e2e.result }}" != "success" ] || \
             [ "${{ needs.supply-chain.result }}" != "success" ]; then
            echo "One or more CI jobs failed"
            echo "  typecheck:    ${{ needs.typecheck.result }}"
            echo "  lint-custom:  ${{ needs.lint-custom.result }}"
            echo "  unit-test:    ${{ needs.unit-test.result }}"
            echo "  build-smoke:  ${{ needs.build-smoke.result }}"
            echo "  installer:    ${{ needs.installer.result }}"
            echo "  e2e:          ${{ needs.e2e.result }}"
            echo "  supply-chain: ${{ needs.supply-chain.result }}"
            exit 1
          fi
          echo "All 7 CI jobs passed — PR ready for review"
