# =============================================================================
# CodeQL — static analysis (SAST) of the code (6.12, F-29).
#
#   javascript-typescript  server, web client, operator console, build scripts
#   java-kotlin            the Android app — Java only, analysed with
#                          build-mode "none": no Gradle build, no Android SDK,
#                          no signing keys or other secrets are needed
#
# Findings go to the repository's Security › Code scanning. Every action is
# pinned to a full commit SHA; the tag it was resolved from is the comment.
# =============================================================================

name: CodeQL

on:
  push:
    branches: [master, 'release/**']
  pull_request:
    branches: [master, 'release/**']
  schedule:
    - cron: '23 4 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: java-kotlin
            build-mode: none
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
