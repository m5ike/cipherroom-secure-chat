# Reference compose file for local use. Production installs are generated by
# install.sh into <dir>/.m5cet/docker-compose.yml from the saved settings.
#
#   docker compose up -d --build                  # app only
#   docker compose --profile admin up -d --build  # app + admin API
#
# Values come from a .env file next to this one (never committed). The admin
# service is the SAME image with a different entry point, and it serves its
# own GUI at "/", so no extra image or web server is needed.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: m5cet:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-5005}:5000"
    environment:
      NODE_ENV: production
      PORT: "5000"
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.org}
      LOG_EVENTS: ${LOG_EVENTS:-0}
      TURN_SERVER_URL: ${TURN_SERVER_URL:-}
      TURN_USERNAME: ${TURN_USERNAME:-}
      TURN_CREDENTIAL: ${TURN_CREDENTIAL:-}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  admin:
    image: m5cet:local
    profiles: ["admin"]
    restart: unless-stopped
    depends_on: [app]
    command: ["node", "dist/admin.cjs"]
    ports:
      - "127.0.0.1:${ADMIN_PORT:-5050}:5050"
    environment:
      NODE_ENV: production
      ENABLE_ADMIN: "1"
      ADMIN_PORT: "5050"
      ADMIN_BIND: "0.0.0.0"
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.org}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5050/admin/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
